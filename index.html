function ContentPanel({db,persist,patient,isTablet,onBackToList,goBackRef,directNavRef,useConfirm,showToast,initialNav,onScreen,requestBackRef,onDraft}){
  const bootRef=React.useRef(undefined);
  if(bootRef.current===undefined){
    const nav=screenMatchesPatient(initialNav, patient) ? initialNav : null;
    bootRef.current=nav||null;
  }
  const boot=bootRef.current;
  const bootDraftLive=!!(boot&&boot.dirty&&boot.draft&&typeof boot.draft==="object"&&boot.ek);
  const [tab,setTab]=useState(boot&&boot.tab==="date"?"date":"item");
  const [rv,setRv]=useState(bootDraftLive?"eval-form":(boot&&boot.rv?boot.rv:"eval-select"));
  const [ek,setEk]=useState(boot&&boot.ek?boot.ek:null);
  const [editRec,setEditRec]=useState(()=>{
    if(!boot||boot.rv!=="eval-form"||!boot.ek||!patient||boot.editRecId==null) return null;
    const list=(db.records[patient.id]||{})[boot.ek]||[];
    return list.find(r=>r.id===boot.editRecId)||null;
  });
  const restoredDraft=bootDraftLive?boot.draft:null;
  const [bootDraft,setBootDraft]=useState(restoredDraft);
  useEffect(()=>{ if(rv!=="eval-form"&&bootDraft) setBootDraft(null); },[rv,bootDraft]);
  const [scoreDisplay,setScoreDisplay]=useState(null); // {label, value, max, accent, bg, border}
  const evalFormDirtyRef=React.useRef(!!restoredDraft); // EvalForm의 isDirty를 공유
  const evalFormSaveRef=React.useRef(null);   // EvalForm의 save 함수
  const skipPatientReset=React.useRef(!!boot);
  useEffect(()=>{
    if(skipPatientReset.current){ skipPatientReset.current=false; return; }
    setRv("eval-select");setEk(null);setEditRec(null);setTab("item");evalFormDirtyRef.current=false;
  },[patient?.id]);

  // 뷰 전환 - React state만으로 관리
  const emitScreen=(partial, reason)=>{
    if(!onScreen) return;
    onScreen({
      patientId:patient?.id||null,
      rv:partial.rv!==undefined?partial.rv:rv,
      tab:partial.tab!==undefined?partial.tab:tab,
      ek:partial.ek!==undefined?partial.ek:ek,
      editRecId:partial.editRecId!==undefined?partial.editRecId:(editRec?editRec.id:null),
      dropDraft:!!partial.dropDraft,
    }, reason||"user");
  };
  const navTo=(nextRv,opts={})=>{
    const nextEk=opts.ek!==undefined?opts.ek:ek;
    const nextEdit=opts.editRec!==undefined?opts.editRec:editRec;
    const nextTab=opts.tab!==undefined?opts.tab:tab;
    if(opts.ek!==undefined) setEk(opts.ek);
    if(opts.editRec!==undefined) setEditRec(opts.editRec);
    if(opts.tab!==undefined) setTab(opts.tab);
    setRv(nextRv);
    emitScreen({
      rv:nextRv,
      ek:nextEk,
      tab:nextTab,
      editRecId:nextEdit&&nextEdit.id!=null?nextEdit.id:null,
      dropDraft:nextRv!=="eval-form"||opts.ek!==undefined,
    }, "user");
  };

  // 외부(App)에서 직접 navTo 호출용 ref
  useEffect(()=>{ if(directNavRef) directNavRef.current=navTo; });


  // goBack: useEffect로 매 렌더 후 즉시 동기화 (가장 안정적)
  const goBackLatest=React.useRef(null);
  const goBack=async()=>{
    if(rv==="eval-form"){
      if(evalFormDirtyRef.current){
        if(evalFormSaveRef.current) evalFormSaveRef.current();
        return true;
      }
      evalFormDirtyRef.current=false;
      const next=tab==="date"?"date-view":"eval-history";
      setEditRec(null);
      setRv(next);
      emitScreen({rv:next, editRecId:null, dropDraft:true}, "user");
      return true;
    } else if(rv==="eval-history"){
      setEk(null);setRv("eval-select");
      emitScreen({rv:"eval-select", ek:null, editRecId:null, dropDraft:true}, "user");
      return true;
    }
    else if(rv==="date-view"){
      setRv("eval-select");
      emitScreen({rv:"eval-select", dropDraft:true}, "user");
      return true;
    }
    else if(rv==="eval-select"){
      if(onBackToList&&onBackToList()) return true;
      return false;
    }
    return false;
  };
  // 매 렌더 후 최신 goBack 동기화
  React.useEffect(()=>{
    goBackLatest.current=goBack;
    if(goBackRef) goBackRef.current=()=>goBackLatest.current();
    if(onScreen && (patient||!(window.__ptBootScreen&&window.__ptBootScreen.patientId))) onScreen({
      patientId:patient?.id||null,
      rv:patient?rv:"eval-select",
      tab,
      ek:patient?ek:null,
      editRecId:patient&&editRec?editRec.id:null,
    }, "effect");
  });

  const getRecs=(k)=>(db.records[patient?.id]?.[k]||[]).slice().sort((a,b)=>{
    const da=a.data?.date||"";const db2=b.data?.date||"";
    if(da!==db2) return db2.localeCompare(da);
    return b.savedAt-a.savedAt;
  });
  const saveRec=(k,data,rid)=>{
    const rec={...db.records},pid=patient.id;
    if(!rec[pid])rec[pid]={};if(!rec[pid][k])rec[pid][k]=[];
    if(rid!=null)rec[pid][k]=rec[pid][k].map(r=>r.id===rid?{...r,data,savedAt:Date.now()}:r);
    else rec[pid][k]=[...rec[pid][k],{id:Date.now(),data,savedAt:Date.now()}];
    persist({...db,records:rec});
    if(showToast){ const nextMap={"BBS":"10mWT","10mWT":"BBS"}; showToast("✅ 저장됐습니다",5000,nextMap[ek]||null); }
  };
  const delRec=async(k,rid,date)=>{
    const ok=await useConfirm(`"${date||"미기재"} ${k}" 항목을 삭제하시겠습니까?`);
    if(!ok) return;
    const rec={...db.records};rec[patient.id][k]=rec[patient.id][k].filter(r=>r.id!==rid);persist({...db,records:rec});
  };
  const crumb=()=>{
    if(!patient) return null;
    const col=ek?EVAL_COLORS[ek]:null;
    const base=<span style={{fontWeight:700,color:"#1e293b"}}>{patient.name}</span>;
    if(ek&&rv==="eval-form") return(
      <span style={{display:"flex",alignItems:"center",gap:"5px",flexWrap:"nowrap"}}>
        {base}
        <span style={{color:"#94a3b8",fontSize:"13px"}}>›</span>
        <span style={{background:col?.bg,color:col?.accent,border:`1.5px solid ${col?.border}`,borderRadius:"6px",padding:"1px 7px",fontSize:"13px",fontWeight:700,whiteSpace:"nowrap"}}>{ek}</span>
        <span style={{color:"#94a3b8",fontSize:"13px"}}>›</span>
        <span style={{fontSize:"13px",fontWeight:600,color:"#475569"}}>{editRec?"수정":"신규"}</span>
      </span>
    );
    if(ek&&rv==="eval-history") return(
      <span style={{display:"flex",alignItems:"center",gap:"5px",flexWrap:"nowrap"}}>
        {base}
        <span style={{color:"#94a3b8",fontSize:"13px"}}>›</span>
        <span style={{background:col?.bg,color:col?.accent,border:`1.5px solid ${col?.border}`,borderRadius:"6px",padding:"1px 7px",fontSize:"13px",fontWeight:700,whiteSpace:"nowrap"}}>{ek}</span>
      </span>
    );
    return base;
  };

  // 날짜별 탭에서 수정 버튼 클릭 시
  const handleDateEditForm=(key,rec)=>{
    navTo("eval-form",{ek:key,editRec:rec});
  };

  if(!patient) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:"10px"}}>
      <IcoUser/>
      <span style={{color:"#94a3b8",fontSize:"14px"}}>환자를 선택하세요</span>
      <span style={{color:"#cbd5e1",fontSize:"12px",textAlign:"center",lineHeight:1.8}}>
        왼쪽 목록에서 환자를 선택하면<br/>평가 기록이 이곳에 표시됩니다.
      </span>
    </div>
  );
  const showBack=rv!=="eval-select"||!isTablet;

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* 서브 헤더 */}
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"0 14px",height:"44px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:"4px",minWidth:0,flex:1,overflow:"hidden"}}>
          {showBack&&<button onClick={()=>requestBackRef&&requestBackRef.current&&requestBackRef.current()} style={{background:"none",border:"none",padding:"4px 4px 4px 0",color:"#475569",cursor:"pointer",display:"flex",alignItems:"center",flexShrink:0}}><IcoBack/></button>}
          <div style={{display:"flex",alignItems:"center",gap:"5px",overflow:"hidden",minWidth:0}}>{crumb()}</div>
        </div>
        {rv==="eval-form"&&scoreDisplay&&(
          <div style={{display:"inline-flex",alignItems:"center",gap:"5px",padding:"4px 11px",background:scoreDisplay.bg,borderRadius:"20px",border:`1.5px solid ${scoreDisplay.border}`,flexShrink:0}}>
            <span style={{fontSize:"11px",fontWeight:700,color:scoreDisplay.accent}}>{scoreDisplay.label}</span>
            <span style={{fontSize:"15px",fontWeight:800,color:scoreDisplay.accent}}>{scoreDisplay.value}</span>
            {scoreDisplay.max&&<span style={{fontSize:"11px",color:"#94a3b8",fontWeight:400}}>/ {scoreDisplay.max}</span>}
          </div>
        )}
      </div>

function MmtInput({value, onChange}){
  const STEPS=["0","1","2-","2","2+","3-","3","3+","4-","4","4+","5"];
  const v=(value||"").trim();
  const idx=STEPS.indexOf(v);
  const step=(dir)=>{
    if(v===""){
      onChange(dir===1?"1":"4");
      return;
    }
    if(idx===-1){ onChange(""); return; }
    const next=idx+dir;
    if(next<0||next>=STEPS.length) return;
    onChange(STEPS[next]);
  };
  const sideBtnStyle={
    width:"22px",height:"34px",border:"none",borderRadius:0,
    background:"transparent",color:"#475569",fontSize:"16px",fontWeight:700,
    cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",
    flexShrink:0,WebkitTapHighlightColor:"transparent",lineHeight:1,padding:0,
  };
  return(
    <div style={{display:"inline-flex",alignItems:"center",
      border:"1.5px solid #e2e8f0",borderRadius:"9px",overflow:"hidden",
      background:"#fff",height:"34px",width:"88px"}}>
      <button
        onTouchStart={e=>e.preventDefault()}
        onMouseDown={e=>{e.preventDefault();step(-1);}}
        style={sideBtnStyle}>−</button>
      <input
        type="text" inputMode="numeric"
        value={value||""}
        onChange={e=>onChange(e.target.value.replace(/[^0-9+\-]/g,""))}
        style={{flex:1,width:0,height:"100%",border:"none",borderLeft:"1px solid #f1f5f9",borderRight:"1px solid #f1f5f9",
          padding:"0 2px",outline:"none",color:"#1e293b",fontSize:"15px",fontWeight:600,
          textAlign:"center",background:"#fff"}}
      />
      <button
        onTouchStart={e=>e.preventDefault()}
        onMouseDown={e=>{e.preventDefault();step(1);}}
        style={sideBtnStyle}>+</button>
    </div>
  );
}


function Toast({data,onAction}){
  if(!data||!data.msg) return null;
  const hasAction=!!(data.nextEval&&onAction);
  // 가로로 두면 좁은 화면에서 문구 칸이 한 글자 너비로 줄어 세로로 쌓인다.
  // 문구는 항상 한 줄, 이어서 하기 버튼은 그 아래. + 버튼(70px)·타이머 버튼보다 위에 둔다.
  return(
    <div id="app-toast" style={{position:"fixed",bottom:"148px",left:"50%",transform:"translateX(-50%)",zIndex:10020,
      background:"#1e293b",color:"#fff",borderRadius:"14px",
      padding:hasAction?"12px 16px":"10px 18px",
      fontSize:"13px",fontWeight:600,lineHeight:1.35,boxShadow:"0 4px 20px rgba(0,0,0,0.25)",
      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:hasAction?"8px":"0",
      width:"max-content",maxWidth:"calc(100vw - 32px)",boxSizing:"border-box",
      pointerEvents:hasAction?"auto":"none",whiteSpace:"nowrap",textAlign:"center"}}>
      <span style={{display:"block",whiteSpace:"nowrap",lineHeight:1.35}}>{data.msg}</span>
      {hasAction&&(
        <button onClick={onAction}
          style={{flexShrink:0,background:"#f97316",color:"#fff",border:"none",borderRadius:"9px",
            padding:"8px 14px",fontSize:"12px",fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",lineHeight:1.3}}>
          {data.nextEval} 이어서 →
        </button>
      )}
    </div>
  );
}

function readScreenState(){
  try{
    const raw=localStorage.getItem("pt_screen_state")||localStorage.getItem("pt_screen_state_keep");
    if(raw){
      const s=JSON.parse(raw);
      if(s&&typeof s==="object") return s;
    }
  }catch(e){}
  try{
    if(typeof window.__ptBootScreen!=="undefined" && window.__ptBootScreen) return window.__ptBootScreen;
  }catch(e){}
  return null;
}
function screenMatchesPatient(screen, patient){
  if(!screen||!patient) return false;
  if(screen.patientId===patient.id) return true;
  if(patient.legacyId && screen.patientId===patient.legacyId) return true;
  return false;
}
function screenWantsContent(s){
  if(!s) return false;
  if(s.mobileView==="content") return true;
  return s.rv==="eval-form"||s.rv==="eval-history"||s.rv==="date-view"||!!s.dirty;
}

              <button onClick={()=>{setShowUpdateBanner(false);localStorage.setItem("pt_seen_version",APP_VERSION);}} style={{flex:1,background:"#2563eb",color:"#fff",border:"none",borderRadius:"10px",padding:"11px",fontSize:"13px",fontWeight:700,cursor:"pointer"}}>확인</button>
            </div>
          </div>

      <div className="topbar">
        <div style={{display:"flex",alignItems:"center",gap:"6px",minWidth:0,flex:1}}>
          {!isTablet&&mobileView==="content"&&(
            <button onClick={()=>{ if(requestBackRef.current) requestBackRef.current(); }} style={{background:"none",border:"none",padding:"6px 6px 6px 0",color:"#475569",cursor:"pointer",display:"flex",alignItems:"center",flexShrink:0}}><IcoBack/></button>
          )}
          {!isTablet&&mobileView==="content"&&patient?(
            <span style={{fontSize:"19px",fontWeight:800,color:"#1e293b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}}>{patient.name}</span>
          ):(
            <span style={{fontSize:"19px",fontWeight:700,color:"#1e293b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}}>환자 평가 관리</span>
          )}
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"3px",flexShrink:0,marginLeft:"8px"}}>
          <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
            <span id="app-version" style={{fontSize:"11px",fontWeight:800,color:"#1d4ed8",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"999px",padding:"0 8px",height:"27px",boxSizing:"border-box",display:"inline-flex",alignItems:"center",flexShrink:0,letterSpacing:"0.2px",lineHeight:1,whiteSpace:"nowrap"}}>{APP_VERSION}</span>
            {(!isTablet||mobileView!=="content")&&(
            <>
              <button onClick={()=>setShowReleaseNotes(true)} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:"7px",padding:"5px 7px",fontSize:"11px",color:"#94a3b8",cursor:"pointer",fontWeight:600,display:"inline-flex",alignItems:"center",flexShrink:0}} title="업데이트 내역"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 3v13"/><path d="M6 11l6 6 6-6"/><path d="M4 20h16"/></svg></button>
              <button onClick={()=>document.dispatchEvent(new CustomEvent("backup-export"))} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:"7px",padding:"5px 9px",fontSize:"11px",color:"#2563eb",cursor:"pointer",fontWeight:600,flexShrink:0,whiteSpace:"nowrap"}}>⬇ 백업</button>
              <button onClick={()=>document.dispatchEvent(new CustomEvent("backup-import"))} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:"7px",padding:"5px 9px",fontSize:"11px",color:"#16a34a",cursor:"pointer",fontWeight:600,flexShrink:0,whiteSpace:"nowrap"}}>⬆ 복원</button>
            </>
            )}
          </div>
          {(!isTablet||mobileView!=="content")&&(
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end"}}>
            {(()=>{
              const d=localStorage.getItem("pt_eval_backup_date");
              const bt=localStorage.getItem("pt_eval_backup_time");
              if(!d) return <span style={{fontSize:"9px",color:"#ef4444",fontWeight:600}}>백업 없음</span>;
              const today=localDateStr();
              const days=Math.floor((new Date(today)-new Date(d))/(1000*60*60*24));
              const color=days>=7?"#ef4444":days>=3?"#f59e0b":"#94a3b8";
              const timeStr=bt?new Date(bt).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}):"";
              const label=days===0?`오늘 ${timeStr}`.trim():days===1?`어제 ${timeStr}`.trim():`${days}일 전`;
              return <span style={{fontSize:"9px",color,fontWeight:600}}>마지막 백업 {label}</span>;
            })()}
          </div>
          )}
        </div>
      </div>
      <div className="main-area">
        <div className="panel-left" style={!isTablet&&mobileView==="content"?{display:"none"}:{}}>
          <PatientListPanel db={db} persist={persist} selectedPatient={patient} onSelect={selectPatient} useConfirm={useConfirm} dismissRef={dismissRef}/>
        </div>
        <div className="panel-right" style={!isTablet&&mobileView==="list"?{display:"none"}:{display:"block",flex:1,overflow:"hidden"}}>
          <ContentPanel db={db} persist={persist} patient={patient} isTablet={isTablet} onBackToList={leaveChart} goBackRef={contentGoBackRef} directNavRef={contentDirectNavRef} useConfirm={useConfirm} showToast={showToast} initialNav={bootNav} onScreen={onScreen} requestBackRef={requestBackRef} onDraft={onDraft}/>
        </div>
      </div>
    </div>
  );
}

function EvalForm({template,col,initialData,onSave,onCancel,dirtyRef,saveRef,useConfirm,onScoreChange,onDraft,restoreDirty}){
  const todayStr=localDateStr();
  const buildInit=()=>{
    const init={};
    (template?.fields||[]).forEach(f=>{
      if(f.type==="table") init[f.id]=f.rows.map(row=>({left:"",right:row.length>=3?"":undefined,score:row.length<3?"":undefined}));
      else if(f.type==="mmt_table") init[f.id]=f.rows.map(()=>({left:"",right:""}));
      else if(f.type==="mmt_sections") init[f.id]={};
      else if(f.type==="bbs_full") init[f.id]=BBS_ITEMS.map(()=>null);
      else if(f.type==="fga_full") init[f.id]=FGA_ITEMS.map(()=>null);
      else if(f.type==="fogq_full") init[f.id]=FOGQ_ITEMS.map(()=>null);
      else if(f.type==="rom_table") init[f.id]={};
      else if(f.type==="disrom_table") init[f.id]={};
      else if(f.type==="tilt_table") init[f.id]=[{angle:"Supine (0°)",time:"",sbp:"",dbp:"",hr:"",spo2:"",symptoms:"없음"}];
      else if(f.type==="date") init[f.id]=todayStr;
      else if(f.type==="toggle") init[f.id]=f.id==="test_failure"?"":f.options?.[0]||"";
      else init[f.id]="";
    });
    return init;
  };
  const [fd,setFdState]=useState(()=>initialData?JSON.parse(JSON.stringify(initialData)):buildInit());
  const fdRef=React.useRef(fd);
  fdRef.current=fd;
  const [isDirty,setIsDirty]=useState(!!restoreDirty);
  const restoreDirtyOnce=React.useRef(false);
  if(restoreDirty&&!restoreDirtyOnce.current){
    restoreDirtyOnce.current=true;
    if(dirtyRef) dirtyRef.current=true;
  }
  useEffect(()=>{ if(onDraft) onDraft(fd, isDirty, "effect"); },[fd,isDirty]);
  const [saveTried,setSaveTried]=useState(false);
  const [showBbsTimer,setShowBbsTimer]=useState(false);
  const [showFgaTimer,setShowFgaTimer]=useState(false);
  const [fingerOpen,setFingerOpen]=useState(false);
  const [flipLayout,setFlipLayout]=useState(false); // true=시작버튼 우측

  // ── 플로팅 타이머 공용 로직 (창 닫혀도 유지) ──
  const useFloatingTimer=(label)=>{
    const [elapsed,setElapsed]=useState(0);
    const [running,setRunning]=useState(false);
    const intervalRef=React.useRef(null);
    const bgStartRef=React.useRef(0);  // 백그라운드 진입 시각
    const baseRef=React.useRef(0);     // 누적 경과 (정지 시점까지)
    const runningRef=React.useRef(false);
    const elapsedRef=React.useRef(0);  // 탭 타이틀용 최신 elapsed

    // interval: baseRef 기준으로만 계산 (startRef 없음)
    const startInterval=()=>{
      clearInterval(intervalRef.current);
      const t0=Date.now();
      const base=baseRef.current;
      intervalRef.current=setInterval(()=>{
        const e=(Date.now()-t0)/1000+base;
        elapsedRef.current=e;
        setElapsed(e);
      },50);
    };
    const start=()=>{baseRef.current=elapsedRef.current;startInterval();runningRef.current=true;setRunning(true);};
    const stop=()=>{
      clearInterval(intervalRef.current);
      baseRef.current=elapsedRef.current;
      runningRef.current=false;setRunning(false);
    };
    const reset=()=>{
      clearInterval(intervalRef.current);
      baseRef.current=0;elapsedRef.current=0;
      setElapsed(0);runningRef.current=false;setRunning(false);
    };
    useEffect(()=>{
      const onVis=()=>{
        if(document.visibilityState==="hidden"&&runningRef.current){
          // 백그라운드 진입: interval 멈추고 진입 시각 기록
          clearInterval(intervalRef.current);
          bgStartRef.current=Date.now();
        } else if(document.visibilityState==="visible"&&runningRef.current){
          // 복귀: 백그라운드 체류 시간을 base에 더하고 재시작
          const bgElapsed=(Date.now()-bgStartRef.current)/1000;
          baseRef.current=elapsedRef.current+bgElapsed;
          startInterval();
        }
      };
      document.addEventListener("visibilitychange",onVis);
      return()=>{document.removeEventListener("visibilitychange",onVis);clearInterval(intervalRef.current);};
    },[]);
    return {elapsed,running,start,stop,reset,runningRef,elapsedRef,label};
  };
  const bbsTimer=useFloatingTimer("BBS");
  const fgaTimer=useFloatingTimer("FGA");

  // 탭 타이틀: 실행 중인 타이머 표시
  useEffect(()=>{
    const activeTimer=bbsTimer.running?bbsTimer:fgaTimer.running?fgaTimer:null;
    if(!activeTimer){
      document.title="환자 평가 관리 "+APP_VERSION;
      return;
    }
    const id=setInterval(()=>{
      const e=activeTimer.elapsedRef.current;
      const m=Math.floor(e/60);
      const s=(e%60).toFixed(1);
      const ts=m>0?`${m}:${s.padStart(4,"0")}`:`${s}초`;
      document.title=`⏱ ${ts} | ${activeTimer.label} 타이머`;
    },100);
    return()=>{
      clearInterval(id);
      document.title="환자 평가 관리 "+APP_VERSION;
    };
  },[bbsTimer.running,fgaTimer.running]);
  // 비프음 + 햅틱 피드백
  // AudioContext 사전 생성 (첫 사용자 제스처 후 resume)
  const audioCtxRef=React.useRef(null);
  const getAudioCtx=()=>{
    if(!audioCtxRef.current){
      audioCtxRef.current=new (window.AudioContext||window.webkitAudioContext)();
    }
    if(audioCtxRef.current.state==="suspended") audioCtxRef.current.resume();
    return audioCtxRef.current;
  };
  const playTone=(ctx,freq,startAt,dur)=>{
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type="sine";
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(0,startAt);
    g.gain.linearRampToValueAtTime(0.35,startAt+0.008);
    g.gain.exponentialRampToValueAtTime(0.001,startAt+dur);
    o.start(startAt); o.stop(startAt+dur);
  };
  const beepHaptic=(type)=>{
    // 햅틱
    if(navigator.vibrate){
      if(type==="start") navigator.vibrate(40);
      else navigator.vibrate([40,60,40]);
    }
    // 음: 당=600Hz 땅=900Hz, 각 음 0.1초, 간격 0.04초
    try{
      const ctx=getAudioCtx();
      const t=ctx.currentTime;
      if(type==="start"){
        // 당(낮) → 땅(높)
        playTone(ctx,600,t,0.10);
        playTone(ctx,900,t+0.13,0.12);
      } else {
        // 땅(높) → 당(낮)
        playTone(ctx,900,t,0.12);
        playTone(ctx,600,t+0.14,0.10);
      }
    }catch(e){}
  };
  const markDirty=()=>{ setIsDirty(true); if(dirtyRef) dirtyRef.current=true; };
  // 입력 핸들러가 끝나는 즉시 저장한다. useEffect까지 기다리면 안드로이드가 앱을 죽일 수 있다.
  const editFd=(mutator)=>{
    const prev=fdRef.current;
    const next=typeof mutator==="function"?mutator(prev):mutator;
    fdRef.current=next;
    setIsDirty(true);
    if(dirtyRef) dirtyRef.current=true;
    if(onDraft) onDraft(next, true, "input");
    setFdState(next);
  };
  const setF=(id,val)=>editFd(prev=>({...prev,[id]:val}));
  const setCell=(tid,ri,ck,val)=>editFd(prev=>{const arr=[...(prev[tid]||[])];arr[ri]={...arr[ri],[ck]:val};return{...prev,[tid]:arr};});
  const setBbs=(ri,score)=>editFd(prev=>{const arr=[...(prev["_bbs"]||BBS_ITEMS.map(()=>null))];arr[ri]=score;return{...prev,"_bbs":arr};});
  const setFga=(ri,score)=>editFd(prev=>{const arr=[...(prev["_fga"]||FGA_ITEMS.map(()=>null))];arr[ri]=score;return{...prev,"_fga":arr};});
  const setFogq=(ri,score)=>editFd(prev=>{const arr=[...(prev["_fogq"]||FOGQ_ITEMS.map(()=>null))];arr[ri]=score;return{...prev,"_fogq":arr};});

  // 타이머 상태: {trial1: {running, startTime, elapsed}, ...}
  const [timers,setTimers]=useState({trial1:{running:false,elapsed:0},trial2:{running:false,elapsed:0},trial3:{running:false,elapsed:0}});
  const timerRefs=React.useRef({});
  const startBtnTouch=React.useRef({moved:false,startX:0,startY:0}); // 시작 버튼 드래그 감지용

  const startTimer=(id)=>{
    beepHaptic("start");
    const startTime=Date.now()-((timers[id]?.elapsed||0)*1000);
    timerRefs.current[id]=setInterval(()=>{
      const elapsed=(Date.now()-startTime)/1000;
      setTimers(prev=>({...prev,[id]:{...prev[id],running:true,elapsed}}));
    },50);
    setTimers(prev=>({...prev,[id]:{...prev[id],running:true}}));
  };

  const stopTimer=(id)=>{
    beepHaptic("stop");
    clearInterval(timerRefs.current[id]);
    setTimers(prev=>{
      const elapsed=prev[id].elapsed;
      const val=elapsed.toFixed(2);
      const next={...fdRef.current,[id]:val};
      fdRef.current=next;
      setIsDirty(true);
      if(dirtyRef) dirtyRef.current=true;
      if(onDraft) onDraft(next, true, "input");
      setFdState(next);
      return {...prev,[id]:{running:false,elapsed}};
    });
  };

  const resetTimer=(id)=>{
    clearInterval(timerRefs.current[id]);
    setTimers(prev=>({...prev,[id]:{running:false,elapsed:0}}));
    setF(id,"");
  };

  useEffect(()=>{
    return()=>{Object.values(timerRefs.current).forEach(t=>clearInterval(t));};
  },[]);

  // 10mWT 자동계산
  useEffect(()=>{
    if(template?.fields?.find(f=>f.id==="avg"&&f.type==="number_auto")){
      const vals=["trial1","trial2","trial3"].map(k=>parseFloat(fd[k])).filter(v=>!isNaN(v));
      const svals=["steps1","steps2","steps3"].map(k=>parseFloat(fd[k])).filter(v=>!isNaN(v));
      const steps_avg=svals.length>0?(svals.reduce((a,b)=>a+b,0)/svals.length).toFixed(1):"";
      if(vals.length>0){
        const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
        const speed=(10/parseFloat(avg)).toFixed(3);
        setFdState(prev=>{
          const next={...prev,avg,speed,steps_avg};
          fdRef.current=next;
          if(dirtyRef&&dirtyRef.current&&onDraft) onDraft(next, true, "input");
          return next;
        });
      } else {
        setFdState(prev=>{
          const next={...prev,avg:"",speed:"",steps_avg};
          fdRef.current=next;
          if(dirtyRef&&dirtyRef.current&&onDraft) onDraft(next, true, "input");
          return next;
        });
      }
    }
  },[fd.trial1,fd.trial2,fd.trial3,fd.steps1,fd.steps2,fd.steps3]);

  // 총점 실시간 계산 → 서브헤더 배지
  useEffect(()=>{
    if(!onScoreChange) return;
    const hasBbs=template?.fields?.some(f=>f.type==="bbs_full");
    const hasFga=template?.fields?.some(f=>f.type==="fga_full");
    const hasFogq=template?.fields?.some(f=>f.type==="fogq_full");
    const hasFac=template?.fields?.some(f=>f.type==="fac_select");
    if(hasBbs){
      const total=(fd["_bbs"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
      onScoreChange({label:"총점",value:total,max:56,accent:"#7c3aed",bg:"#f3eeff",border:"#8b5cf6"});
    } else if(hasFga){
      const total=(fd["_fga"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
      onScoreChange({label:"총점",value:total,max:30,accent:"#16a34a",bg:"#f0fdf4",border:"#16a34a"});
    } else if(hasFogq){
      const total=(fd["_fogq"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
      onScoreChange({label:"총점",value:total,max:24,accent:"#f97316",bg:"#fef3f2",border:"#f97316"});
    } else if(hasFac){
      const score=fd["score"]??"";
      if(score!=="") onScoreChange({label:"FAC",value:score,max:null,accent:"#e53e6d",bg:"#fde8ef",border:"#e53e6d"});
      else onScoreChange(null);
    } else {
      onScoreChange(null);
    }
  },[fd]);

  const isTestFailure = fd["test_failure"] === "Test failure";
  const FAILURE_DISABLED = ["speed_type","trial1","trial2","trial3","avg","speed","steps_avg","assistive","orthosis","assist_level","steps1","steps2","steps3"];

  const handleSave=()=>{
    setSaveTried(true);
    const final={...fd};
    // 검사일 미입력 시 오늘 날짜로 자동 채움
    if(final.date===undefined||final.date==="") final.date=localDateStr();
    if(template?.fields?.find(f=>f.type==="bbs_full")){
      final.bbs_total=(fd["_bbs"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
    }
    if(template?.fields?.find(f=>f.type==="fga_full")){
      final.fga_total=(fd["_fga"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
    }
    if(template?.fields?.find(f=>f.type==="fogq_full")){
      final.fogq_total=(fd["_fogq"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
    }
    setIsDirty(false);
    if(dirtyRef) dirtyRef.current=false;
    if(onDraft) onDraft(final, false, "user");
    onSave(final,false);
  };
  const handleAutoSave=()=>{
    // 빌드된 final 데이터를 그대로 handleSave 로직 재활용 - onSave에 isAuto=true 전달
    const final={...fd};
    if(template?.fields?.find(f=>f.type==="bbs_full")){
      final.bbs_total=(fd["_bbs"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
    }
    if(template?.fields?.find(f=>f.type==="fga_full")){
      final.fga_total=(fd["_fga"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
    }
    if(template?.fields?.find(f=>f.type==="fogq_full")){
      final.fogq_total=(fd["_fogq"]||[]).reduce((s,v)=>s+(typeof v==="number"?v:parseInt(v)||0),0);
    }
    setIsDirty(false);
    if(dirtyRef) dirtyRef.current=false;
    if(onDraft) onDraft(final, false, "user");
    onSave(final,true);
  };

  // saveRef에 handleAutoSave 등록 (뒤로가기 자동저장용)
  useEffect(()=>{ if(saveRef) saveRef.current=handleAutoSave; },[fd,isDirty]);

  const handleCancel=()=>{
    if(isDirty){ handleAutoSave(); return; }
    onCancel();
  };

  return(
    <div>
    <div style={S.formCard}>
      {(template?.fields||[]).map(field=>{
        const disabled = isTestFailure && FAILURE_DISABLED.includes(field.id);

        if(field.type==="fac_select"){
          const sel=fd[field.id]??"";
          return(
            <div key={field.id} style={S.fieldRow}>
              <label style={S.fieldLabel}>{field.label}</label>
              {/* 라디오 점수 선택 행 */}
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"10px",padding:"10px 12px",background:"#f8fafc",borderRadius:"8px",border:"1.5px solid #e2e8f0"}}>
                {field.rows.map(([val])=>{
                  const on=sel===val;
                  return(
                    <div key={val} onClick={()=>{setF(field.id,val);if(field.linkedTo)setF(field.linkedTo,val);}}
                      style={{display:"flex",alignItems:"center",gap:"5px",cursor:"pointer",padding:"4px 8px",borderRadius:"6px",background:on?col.bg:"transparent"}}>
                      <div style={{width:"16px",height:"16px",borderRadius:"50%",border:`2px solid ${on?col.accent:"#94a3b8"}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        {on&&<div style={{width:"8px",height:"8px",borderRadius:"50%",background:col.accent}}/>}
                      </div>
                      <span style={{fontSize:"13px",fontWeight:on?700:400,color:on?col.accent:"#475569"}}>{val}점</span>
                    </div>
                  );
                })}
              </div>
              {/* 표 */}
              <div style={{...S.tblSection,marginBottom:0}}>
                <table style={{...S.table,marginBottom:0}}>
                  <tbody>
                    {field.rows.map(([val,desc])=>{
                      const on=sel===val;
                      return(
                        <tr key={val} onClick={()=>{setF(field.id,val);if(field.linkedTo)setF(field.linkedTo,val);}}
                          style={{cursor:"pointer",background:on?col.bg:"white",transition:"background 0.1s"}}>
                          <td style={{...S.td,width:"64px",textAlign:"center",fontWeight:800,fontSize:"13px",color:on?col.accent:"#475569",borderRight:"1.5px solid #e2e8f0",whiteSpace:"nowrap"}}>FAC {val}</td>
                          <td style={{...S.td,fontSize:"12px",lineHeight:1.7,color:on?col.text:"#334155",whiteSpace:"pre-line"}}>{desc}</td>

                    return(
                      <div key={idx} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}}>
                        <div style={{width:"32px",height:"32px",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:"14px",
                          background:filled?"#f97316":"#fff",color:filled?"#fff":"#94a3b8",
                          border:`1.5px solid ${filled?"#f97316":"#cbd5e1"}`}}>
                          {filled?s:"·"}
                        </div>
                        <span style={{fontSize:"9px",color:"#94a3b8",fontWeight:600}}>{idx+1}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        if(field.type==="disrom_table"){
          const disData=fd["_disrom"]||{};
          return(
            <div key={field.id}>
              <DisRomTable
                data={disData}
                readOnly={false}
                onChange={v=>{markDirty();editFd(prev=>({...prev,"_disrom":v}));}}
              />
            </div>
          );
        }

        if(field.type==="tilt_table"){
          const tiltData=fd["_tilt"]||[{angle:"Supine (0°)",time:"",sbp:"",dbp:"",hr:"",spo2:"",symptoms:"없음"}];
          return(
            <div key={field.id}>
              <TiltTable
                data={tiltData}
                readOnly={false}
                onChange={v=>{markDirty();editFd(prev=>({...prev,"_tilt":v}));}}
              />
            </div>
          );
        }

        if(field.type==="table"){
          const td=fd[field.id]||[],two=field.headers.length>=4,one=field.headers.length===3;
          return(
            <div key={field.id} style={S.tblSection}><div style={{overflowX:"auto"}}>
              <table style={{...S.table,marginBottom:0}}>
                <thead><tr>{field.headers.map((h,i)=><th key={i} style={S.th}>{h}</th>)}</tr></thead>
                <tbody>
                  {field.rows.map((row,ri)=>(
                    <tr key={ri} style={{background:ri%2===0?"#fafbfc":"white"}}>
                      {row.map((cell,ci)=><td key={ci} style={S.td}>{cell}</td>)}
                      {two&&<><td style={S.td}><input style={S.cellInput} value={td[ri]?.left??""} onChange={e=>setCell(field.id,ri,"left",e.target.value)}/></td><td style={S.td}><input style={S.cellInput} value={td[ri]?.right??""} onChange={e=>setCell(field.id,ri,"right",e.target.value)}/></td></>}
                      {one&&!two&&<td style={S.td}><input style={S.cellInput} value={td[ri]?.score??""} onChange={e=>setCell(field.id,ri,"score",e.target.value)}/></td>}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div></div>
          );
        }

        if(field.type==="number_auto"){
          return(
            <div key={field.id} style={S.fieldRow}>
              <label style={S.fieldLabel}>{field.label} <span style={{color:"#3b9ede",fontSize:"10px",fontWeight:600,marginLeft:"4px"}}>● 자동계산</span></label>
              <input style={S.inputAuto} type="text" readOnly value={isTestFailure?"—":fd[field.id]||""} placeholder={field.placeholder}/>
            </div>
          );
        }

        const trialNum = field.id==="trial1"?1:field.id==="trial2"?2:field.id==="trial3"?3:0;
        const isTrialField = trialNum>0;
        const stepsId = "steps"+trialNum;

        if(isTrialField){
          const dividerAndFlip = trialNum===1 ? (
            <div key="flip-ctrl" style={{marginBottom:"12px",display:"flex",justifyContent:"flex-end"}}>
              <button onClick={()=>setFlipLayout(v=>!v)}
                style={{display:"flex",alignItems:"center",gap:"6px",padding:"6px 14px",borderRadius:"20px",border:"1.5px solid #cbd5e1",background:"#f8fafc",color:"#475569",fontSize:"12px",fontWeight:600,cursor:"pointer",WebkitTapHighlightColor:"transparent"}}>
                <span>{flipLayout?"⇆ 시작버튼 오른쪽":"⇆ 시작버튼 왼쪽"}</span>
              </button>
            </div>
          ) : (
            <div key={"div"+trialNum} style={{height:"2px",background:"linear-gradient(to right,#e2e8f0,#cbd5e1,#e2e8f0)",borderRadius:"2px",margin:"0 0 12px 0"}}/>
          );
          const tm=timers[field.id]||{running:false,elapsed:0};
          const display=tm.running ? tm.elapsed.toFixed(2) : (fd[field.id]||"");
          const stepsDisabled = isTestFailure;
          const btnBlock = (
            <div style={{flex:1,display:"flex"}}>
              {tm.running?(
                <button
                  onTouchEnd={e=>{e.preventDefault();stopTimer(field.id);}}
                  onClick={()=>stopTimer(field.id)}
                  style={{flex:1,borderRadius:"14px",border:"2px solid #ef4444",background:"#fef2f2",color:"#ef4444",fontSize:"28px",fontWeight:700,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"2px"}}>
                  <span style={{fontSize:"11px",fontWeight:600,opacity:0.55}}>시행 {trialNum}</span>
                  <span>■ 정지</span>
                </button>
              ):fd[field.id]?(
                <button disabled
                  style={{flex:1,borderRadius:"14px",border:"2px solid #cbd5e1",background:"#f1f5f9",color:"#94a3b8",fontSize:"20px",fontWeight:700,cursor:"default",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"2px"}}>
                  <span style={{fontSize:"11px",fontWeight:600,opacity:0.7}}>시행 {trialNum}</span>
                  <span>✓ 측정완료</span>
                </button>
              ):(
                <button
                  onTouchStart={e=>{const t=e.touches?.[0];if(t){startBtnTouch.current={moved:false,startX:t.clientX,startY:t.clientY};}}}
                  onTouchMove={e=>{const t=e.touches?.[0];if(t){const dx=Math.abs(t.clientX-startBtnTouch.current.startX);const dy=Math.abs(t.clientY-startBtnTouch.current.startY);if(dx>5||dy>5)startBtnTouch.current.moved=true;}}}
                  onTouchEnd={e=>{if(startBtnTouch.current.moved)return;e.preventDefault();startTimer(field.id);}}
                  onClick={()=>startTimer(field.id)}
                  style={{flex:1,borderRadius:"14px",border:`2px solid ${col.accent}`,background:"#fff",color:col.accent,fontSize:"28px",fontWeight:700,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"2px"}}>
                  <span style={{fontSize:"11px",fontWeight:600,opacity:0.55}}>시행 {trialNum}</span>
                  <span>▶ 시작</span>
                </button>
              )}
            </div>
          );
          const resetBlock = (
            <div style={{display:"flex",alignItems:"center"}}>
              <button onClick={()=>resetTimer(field.id)}
                style={{width:"40px",height:"40px",borderRadius:"10px",border:"1.5px solid #e2e8f0",background:"#fff",color:"#94a3b8",fontSize:"18px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                ↺
              </button>
            </div>
          );
          const dataBlock = (
            <div style={{display:"flex",flexDirection:"column",gap:"8px",flex:"0 0 auto"}}>
              <div>
                <div style={{fontSize:"11px",fontWeight:700,color:"#64748b",marginBottom:"4px",textTransform:"uppercase",letterSpacing:"0.5px"}}>시간 (초)</div>
                <input style={{border:"1.5px solid #e2e8f0",borderRadius:"8px",padding:"10px 6px",outline:"none",color:tm.running?"#2563eb":"#1e293b",width:"70px",fontSize:"16px",textAlign:"center",fontVariantNumeric:"tabular-nums",fontWeight:tm.running?700:400,background:"#fff"}}
                  type="text" inputMode="decimal"
                  placeholder="" value={display}
                  onChange={e=>{if(!tm.running)setF(field.id,e.target.value);}}
                  onKeyDown={e=>{if(e.key==="Enter"||e.key==="Go"||e.key==="Next")e.target.blur();}}
                  readOnly={tm.running}
                />
              </div>
              <div style={{opacity:stepsDisabled?0.35:1,pointerEvents:stepsDisabled?"none":"auto"}}>
                <div style={{fontSize:"11px",fontWeight:700,color:"#64748b",marginBottom:"4px",textTransform:"uppercase",letterSpacing:"0.5px"}}>스텝 수</div>
                <input style={{border:"1.5px solid #e2e8f0",borderRadius:"8px",padding:"10px 6px",outline:"none",color:"#1e293b",width:"70px",fontSize:"16px",textAlign:"center",background:"#fff"}}
                  inputMode="numeric" placeholder=""
                  value={fd[stepsId]||""} onChange={e=>setF(stepsId,e.target.value)} onKeyDown={e=>{if(e.key==="Enter"||e.key==="Go"||e.key==="Next")e.target.blur();}}/>
              </div>
            </div>
          );
          return(
            <React.Fragment key={field.id}>
              {dividerAndFlip}
            <div style={{borderRadius:"12px",border:`1.5px solid ${col.border}`,background:col.bg,padding:"12px 14px",marginBottom:"12px",opacity:disabled?0.35:1,pointerEvents:disabled?"none":"auto"}}>
              {/* 시행 헤더 */}
              <div style={{textAlign:"center",marginBottom:"10px"}}>
                <span style={{fontSize:"12px",fontWeight:700,color:col.accent,border:`1.5px solid ${col.border}`,borderRadius:"7px",padding:"2px 14px",display:"inline-block",background:"#fff"}}>
                  시행 {trialNum}
                </span>
              </div>
              {/* flipLayout에 따라 좌우 배치 */}
              <div style={{display:"flex",gap:"8px",alignItems:"stretch",flexDirection:flipLayout?"row-reverse":"row"}}>
                {btnBlock}
                {resetBlock}
                {dataBlock}
              </div>
            </div>
            </React.Fragment>
          );
        }

                // steps 필드는 trial 블록에서 처리하므로 여기서 스킵
        if(["steps1","steps2","steps3","steps_avg"].includes(field.id)) return null;

        if(field.type==="date"){
          const isBBS = template?.fields?.some(f=>f.type==="bbs_full");
          return(
            <div key={field.id} style={{...S.fieldRow, opacity: disabled ? 0.35 : 1, pointerEvents: disabled ? "none" : "auto"}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <label style={S.fieldLabel}>{field.label}</label>
                <input style={{border:`1.5px solid ${saveTried&&!fd[field.id]?"#f87171":"#e2e8f0"}`,borderRadius:"9px",padding:"6px 10px",outline:"none",color:"#475569",fontSize:"14px",fontWeight:400,background:"#fff",cursor:"pointer"}} type="date" value={fd[field.id]||""} onChange={e=>{markDirty();setF(field.id,e.target.value);}} required/>
                <div style={{flex:1}}/>
                {isBBS&&(
                  <>
                    <button onClick={()=>{markDirty();editFd(prev=>({...prev,"_bbs":BBS_ITEMS.map(item=>item.opts[item.opts.length-1][0])}));}}
                      style={{padding:"6px 14px",borderRadius:"9px",border:"1.5px solid #fca5a5",background:"#fef2f2",color:"#dc2626",fontSize:"13px",fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
                      0점
                    </button>
                    <button onClick={()=>{markDirty();editFd(prev=>({...prev,"_bbs":BBS_ITEMS.map(item=>item.opts[0][0])}));}}
                      style={{padding:"6px 14px",borderRadius:"9px",border:"1.5px solid #93c5fd",background:"#eff6ff",color:"#1d4ed8",fontSize:"13px",fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
                      56점
                    </button>
                  </>
                )}
              </div>
            </div>
          );
        }

        return(
          <div key={field.id} style={{...S.fieldRow, opacity: disabled ? 0.35 : 1, pointerEvents: disabled ? "none" : "auto"}}>
            <label style={S.fieldLabel}>{field.label}</label>
            {field.type==="toggle"?(
              <div style={{display:"flex",gap:"7px",flexWrap:"wrap"}}>
                {field.id==="test_failure"?(
                  <button onClick={()=>setF(field.id,fd[field.id]==="Test failure"?"":"Test failure")}
                    style={{border:`1.5px solid ${fd[field.id]==="Test failure"?"#ef4444":"#cbd5e1"}`,borderRadius:"9px",padding:"8px 16px",fontSize:"14px",cursor:"pointer",background:fd[field.id]==="Test failure"?"#ef4444":"#fff",color:fd[field.id]==="Test failure"?"#fff":"#475569",fontWeight:fd[field.id]==="Test failure"?700:400}}>
                    Test Failure
                  </button>
                ):(
                  field.options.map(opt=>{
                    const on=fd[field.id]===opt;
                    return <button key={opt} onClick={()=>setF(field.id,opt)} style={{border:`1.5px solid ${on?col.accent:"#cbd5e1"}`,borderRadius:"9px",padding:"8px 16px",fontSize:"14px",cursor:"pointer",background:on?col.accent:"#fff",color:on?"#fff":"#475569",fontWeight:on?700:400}}>{opt}</button>;
                  })
                )}
              </div>
            ):field.type==="textarea"?(
              <textarea style={S.textarea} placeholder={field.placeholder} value={fd[field.id]||""} onChange={e=>setF(field.id,e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&e.shiftKey)return;if(e.key==="Enter"){e.preventDefault();e.target.blur();}}}/>
            ):(
              (
                <input style={{...S.input,borderColor:field.id==="trial1"||field.id==="trial2"||field.id==="trial3"?"#60a5fa":undefined, borderWidth:field.id==="trial1"||field.id==="trial2"||field.id==="trial3"?"2px":undefined}} type="text" inputMode={field.inputMode||(field.type==="number"?"decimal":undefined)} placeholder={field.placeholder} value={fd[field.id]||""} onChange={e=>setF(field.id,e.target.value)} onKeyDown={e=>{if(e.key==="Enter"||e.key==="Go"||e.key==="Next")e.target.blur();}}/>
              )
            )}
          </div>
        );
      })}
    </div>
    {/* FGA 타이머 플로팅 버튼 */}
    {template?.fields?.some(f=>f.type==="fga_full")&&(
      <>
        {showFgaTimer&&<FgaFloatingTimer onClose={()=>setShowFgaTimer(false)} elapsed={fgaTimer.elapsed} running={fgaTimer.running} start={()=>{beepHaptic("start");fgaTimer.start();}} stop={()=>{beepHaptic("stop");fgaTimer.stop();}} reset={fgaTimer.reset}/>}
        <div onClick={()=>setShowFgaTimer(v=>!v)}
          style={{position:"fixed",left:"20px",bottom:"84px",zIndex:500,width:"48px",height:"48px",borderRadius:"50%",
            background:showFgaTimer?"#16a34a":"#f0fdf4",border:"2px solid #16a34a",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:"22px",cursor:"pointer",boxShadow:"0 4px 14px rgba(22,163,74,0.3)",
            WebkitTapHighlightColor:"transparent"}}>
          ⏱
        </div>
      </>
    )}
    {/* BBS 타이머 플로팅 버튼 */}
    {template?.fields?.some(f=>f.type==="bbs_full")&&(
      <>
        {showBbsTimer&&<BbsFloatingTimer onClose={()=>setShowBbsTimer(false)} elapsed={bbsTimer.elapsed} running={bbsTimer.running} start={()=>{beepHaptic("start");bbsTimer.start();}} stop={()=>{beepHaptic("stop");bbsTimer.stop();}} reset={bbsTimer.reset}/>}
        <div onClick={()=>setShowBbsTimer(v=>!v)}
          style={{position:"fixed",left:"20px",bottom:"84px",zIndex:500,width:"48px",height:"48px",borderRadius:"50%",
            background:showBbsTimer?"#6d28d9":"#f3eeff",border:"2px solid #8b5cf6",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:"22px",cursor:"pointer",boxShadow:"0 4px 14px rgba(109,40,217,0.3)",
            WebkitTapHighlightColor:"transparent"}}>
          ⏱
        </div>
      </>
    )}
    {/* 플로팅 저장 버튼 - 좌측 하단 뒤로가기 버튼 오른쪽 */}
    <div style={{position:"fixed",right:"20px",bottom:"24px",zIndex:500,display:"flex",alignItems:"center",gap:"6px",background:col.accent,borderRadius:"28px",padding:"13px 24px",fontSize:"14px",fontWeight:700,color:"#fff",cursor:"pointer",boxShadow:"0 4px 16px rgba(0,0,0,0.2)",WebkitTapHighlightColor:"transparent"}} onClick={handleSave}>
      {isDirty&&<span style={{width:"7px",height:"7px",borderRadius:"50%",background:"rgba(255,255,255,0.7)",display:"inline-block",flexShrink:0}}/>}
      저장
    </div>
    <div style={{height:"80px"}}/></div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
